[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-mnist-lenet"
version = "1.0.0"
description = "Research Tab's complete LeNet/MNIST tutorial experiment"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "psutil>=6,<8",
  "researchtab>=0.4,<0.5",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: downloads MNIST and trains the model"]

[tool.setuptools]
py-modules = ["train"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
