name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Smoke train against a tiny in-memory batch
        run: python -c "import torch; from train import LeNet5; y=LeNet5()(torch.zeros(2,1,28,28)); assert y.shape == (2,10)"
